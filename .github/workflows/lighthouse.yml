name: Production Mobile Web Lighthouse Measurements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: mobile-web-lighthouse-production
  cancel-in-progress: true

jobs:
  lighthouse:
    uses: DoctorDerek/DoctorDerekCICD/.github/workflows/lighthouse.yml@451abd174a5fb67b534e424cb3ffc337705e4200
    with:
      production-url: https://portfolio-crm.doctorderek.com/
