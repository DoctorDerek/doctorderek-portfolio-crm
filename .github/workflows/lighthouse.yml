name: Production Mobile Web Lighthouse Measurements

on:
  push:
    branches:
      - main

concurrency:
  group: mobile-web-lighthouse-production
  cancel-in-progress: true

jobs:
  measure:
    name: Measure Mobile Web Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Wait for Matching Vercel Production Deployment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          retries: 3
          script: |
            const productionEnvironment = "Production";
            const vercelDeploymentCreator = "vercel[bot]";
            const maximumPollingAttempts = 16;
            const pollingIntervalMilliseconds = 60_000;
            const waitForNextPollingAttempt = () =>
              new Promise(resolve =>
                setTimeout(resolve, pollingIntervalMilliseconds),
              );

            for (
              let pollingAttempt = 1;
              pollingAttempt <= maximumPollingAttempts;
              pollingAttempt += 1
            ) {
              const { data: deployments } =
                await github.rest.repos.listDeployments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                  environment: productionEnvironment,
                  per_page: 10,
                });
              const matchingDeployment = deployments.find(
                deployment =>
                  deployment.creator?.login === vercelDeploymentCreator,
              );

              if (matchingDeployment) {
                const { data: statuses } =
                  await github.rest.repos.listDeploymentStatuses({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: matchingDeployment.id,
                    per_page: 1,
                  });
                const latestStatus = statuses[0];

                if (latestStatus?.state === "success") {
                  core.info(
                    `Vercel Production deployment ${matchingDeployment.id} is ready.`,
                  );
                  return;
                }

                if (
                  latestStatus?.state === "failure" ||
                  latestStatus?.state === "error"
                ) {
                  throw new Error(
                    `Vercel Production deployment ${matchingDeployment.id} finished with ${latestStatus.state}.`,
                  );
                }
              }

              if (pollingAttempt < maximumPollingAttempts) {
                core.info(
                  `Waiting for Vercel Production deployment ${context.sha} (${pollingAttempt}/${maximumPollingAttempts}).`,
                );
                await waitForNextPollingAttempt();
              }
            }

            throw new Error(
              `Vercel Production deployment ${context.sha} did not succeed within 15 minutes.`,
            );

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mobile Web Lighthouse Measurements
        run: pnpm lighthouse

      - name: Prepare Median-Performance Lighthouse Report
        run: pnpm lighthouse:prepare
        env:
          LIGHTHOUSE_RESULTS_DIRECTORY: lighthouse-results
          LIGHTHOUSE_PUBLISHED_DIRECTORY: lighthouse-pages

      - name: Upload Complete Lighthouse Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-web-lighthouse-reports
          path: lighthouse-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: lighthouse-pages/

  deploy:
    name: Publish Mobile Web Lighthouse
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-first.outputs.page_url || steps.deploy-second.outputs.page_url || steps.deploy-final.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deploy-first
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait Before Second Deployment Attempt
        if: steps.deploy-first.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages Deployment
        id: deploy-second
        if: steps.deploy-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Wait Before Final Deployment Attempt
        if: steps.deploy-first.outcome == 'failure' && steps.deploy-second.outcome == 'failure'
        run: sleep 90

      - name: Final GitHub Pages Deployment Attempt
        id: deploy-final
        if: steps.deploy-first.outcome == 'failure' && steps.deploy-second.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
